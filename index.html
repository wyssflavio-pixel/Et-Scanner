<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ET-Scanner – Tschopp</title>
<script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
<style>
:root{--g1:#1A5C1A;--g2:#2E7D2E;--g3:#4CAF50;--gl:#E8F5E8;--red:#E53935;--blue:#1565C0;--bl:#E3F2FD;--grey:#f4f6f4;--shadow:0 4px 20px rgba(0,0,0,.10);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--grey);min-height:100vh;}
.header{background:var(--g1);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-size:18px;font-weight:800;}
.header-sub{font-size:11px;opacity:.7;margin-top:2px;}
.user-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;}
.wrap{padding:14px;max-width:480px;margin:0 auto;}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:30px;}
.login-logo{font-size:64px;margin-bottom:16px;}
.login-title{font-size:24px;font-weight:800;color:var(--g1);margin-bottom:8px;text-align:center;}
.login-sub{font-size:14px;color:#888;margin-bottom:32px;text-align:center;line-height:1.6;}
.btn-ms{background:#0078d4;color:#fff;border:none;border-radius:12px;padding:16px 24px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;justify-content:center;}
.main-screen{display:none;}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.tab{flex:1;padding:10px 4px;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;color:#999;cursor:pointer;transition:all .2s;}
.tab.on{background:var(--g1);color:#fff;}
.hidden{display:none!important;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.card-title{font-size:12px;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.scanner-wrap{position:relative;border-radius:16px;overflow:hidden;background:#000;margin-bottom:12px;}
#qr-video{width:100%;height:260px;object-fit:cover;display:block;}
.sf-corner{position:absolute;width:30px;height:30px;border-color:var(--g3);border-style:solid;}
.sf-tl{top:30px;left:30px;border-width:4px 0 0 4px;border-radius:4px 0 0 0;}
.sf-tr{top:30px;right:30px;border-width:4px 4px 0 0;border-radius:0 4px 0 0;}
.sf-bl{bottom:30px;left:30px;border-width:0 0 4px 4px;border-radius:0 0 0 4px;}
.sf-br{bottom:30px;right:30px;border-width:0 4px 4px 0;border-radius:0 0 4px 0;}
.scan-line{position:absolute;left:30px;right:30px;height:2px;background:linear-gradient(90deg,transparent,var(--g3),transparent);animation:sl 2s ease-in-out infinite;top:50%;}
@keyframes sl{0%,100%{transform:translateY(-100px)}50%{transform:translateY(100px)}}
.scanner-status{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:500;}
.debug-box{background:#1a1a1a;color:#00ff00;font-family:monospace;font-size:11px;padding:8px 12px;border-radius:8px;margin-bottom:10px;word-break:break-all;min-height:24px;}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn:active{transform:scale(.97);}
.btn-green{background:var(--g1);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-light{background:var(--gl);color:var(--g1);margin-top:8px;}
.btn-red{background:var(--red);color:#fff;}
.et-found{border-left:5px solid var(--g1);}
.et-nr{font-size:22px;font-weight:800;color:var(--g1);}
.et-bez{font-size:15px;font-weight:600;margin-top:2px;}
.et-anlage{font-size:12px;color:#777;margin-top:2px;margin-bottom:10px;}
.et-details{font-size:12px;color:#555;margin-bottom:10px;line-height:1.8;background:#f9f9f9;border-radius:8px;padding:10px 12px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.stat{background:var(--grey);border-radius:10px;padding:10px 6px;text-align:center;}
.stat-lbl{font-size:10px;color:#999;margin-bottom:3px;}
.stat-val{font-size:20px;font-weight:800;}
.ok{color:var(--g2);}.warn{color:#E65100;}.crit{color:var(--red);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.badge-ok{background:#E8F5E8;color:var(--g2);}
.badge-best{background:#FFF9C4;color:#E65100;}
.badge-krit{background:#FFEBEE;color:var(--red);}
.buchung-type{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.type-btn{padding:14px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;cursor:pointer;text-align:center;transition:all .2s;font-size:13px;font-weight:600;color:#666;}
.type-btn.active-abgang{border-color:var(--red);background:#FFEBEE;color:var(--red);}
.type-btn.active-zugang{border-color:var(--blue);background:var(--bl);color:var(--blue);}
.type-icon{font-size:28px;display:block;margin-bottom:4px;}
.menge-row{display:flex;align-items:center;gap:12px;margin:14px 0;}
.m-btn{width:52px;height:52px;border-radius:50%;border:none;font-size:30px;font-weight:700;cursor:pointer;flex-shrink:0;}
.m-btn:active{transform:scale(.9);}
.m-minus{background:#FFE0E0;color:var(--red);}
.m-plus{background:var(--gl);color:var(--g1);}
.m-num{flex:1;text-align:center;font-size:44px;font-weight:800;color:var(--g1);border:2px solid #ddd;border-radius:12px;padding:8px 4px;}
.preview-neu{text-align:center;font-size:13px;color:#666;margin-bottom:12px;}
.preview-neu strong{font-size:18px;color:var(--g1);}
.manual-row{display:flex;gap:8px;margin-bottom:12px;}
.manual-row input{flex:1;padding:12px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;}
.manual-row input:focus{outline:none;border-color:var(--g2);}
.manual-row button{padding:12px 16px;background:var(--g1);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:700;}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:.5px solid #f0f0f0;}
.hist-item:last-child{border:none;}
.hist-nr{font-weight:700;font-size:14px;}
.hist-bez{font-size:12px;color:#888;}
.hist-time{font-size:11px;color:#bbb;margin-top:2px;}
.hist-amt{font-size:20px;font-weight:800;}
.hist-amt.abgang{color:var(--red);}
.hist-amt.zugang{color:var(--blue);}
.loading{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spinner{width:48px;height:48px;border:4px solid var(--gl);border-top-color:var(--g1);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:15px;color:var(--g1);font-weight:600;text-align:center;padding:0 20px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:13px 22px;border-radius:30px;font-size:14px;font-weight:600;transition:transform .3s;z-index:9999;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--g1);}
.toast.err{background:var(--red);}
.toast.info{background:var(--blue);}
</style>
</head>
<body>
<div class="header">
  <div><div class="header-title">📦 ET-Scanner</div><div class="header-sub">Tschopp Holzindustrie AG</div></div>
  <div class="user-badge" id="user-badge" style="display:none;">👤 <span id="user-name">–</span></div>
</div>

<div class="login-screen" id="login-screen">
  <div class="login-logo">🏭</div>
  <div class="login-title">ET-Scanner</div>
  <div class="login-sub">Melde dich mit deinem<br>Tschopp Microsoft-Konto an</div>
  <button class="btn-ms" onclick="login()">
    <span style="background:#fff;border-radius:3px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;">M</span>
    Mit Microsoft anmelden
  </button>
  <button onclick="forceLogout()" style="margin-top:12px;background:none;border:1px solid #ccc;border-radius:12px;padding:12px;width:100%;color:#888;font-size:14px;cursor:pointer;">
    🔄 Alle Konten abmelden & neu starten
  </button>
</div>

<div class="main-screen" id="main-screen">
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" onclick="goTab('scan')">📷 Scan</button>
      <button class="tab" onclick="goTab('hist')">📋 Verlauf</button>
      <button class="tab" onclick="goTab('info')">ℹ️ Info</button>
    </div>

    <div id="tab-scan">
      <div class="scanner-wrap">
        <video id="qr-video" autoplay playsinline muted></video>
        <div class="sf-corner sf-tl"></div>
        <div class="sf-corner sf-tr"></div>
        <div class="sf-corner sf-bl"></div>
        <div class="sf-corner sf-br"></div>
        <div class="scan-line"></div>
        <div class="scanner-status" id="scan-status">QR-Code auf Kiste halten…</div>
      </div>

      <!-- Debug box - zeigt was gescannt wurde -->
      <div class="debug-box" id="debug-box">Warte auf Scan…</div>

      <div class="manual-row">
        <input type="text" id="manual-et" placeholder="ET-Nr oder Art-Nr suchen" />
        <button onclick="manualSearch()">🔍</button>
      </div>

      <div class="card et-found hidden" id="et-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
          <div class="et-nr" id="et-nr">–</div>
          <span class="badge" id="et-badge">OK</span>
        </div>
        <div class="et-bez" id="et-bez">–</div>
        <div class="et-anlage" id="et-anlage">–</div>
        <div class="et-details" id="et-details">–</div>
        <div class="stats">
          <div class="stat"><div class="stat-lbl">Bestand</div><div class="stat-val" id="s-ist">–</div></div>
          <div class="stat"><div class="stat-lbl">Mindest</div><div class="stat-val" id="s-min">–</div></div>
          <div class="stat"><div class="stat-lbl">Maximal</div><div class="stat-val" id="s-max">–</div></div>
        </div>
      </div>

      <div class="card hidden" id="menge-card">
        <div class="card-title">Buchungstyp</div>
        <div class="buchung-type">
          <button class="type-btn active-abgang" id="btn-abgang" onclick="setTyp('abgang')">
            <span class="type-icon">📤</span>Abgang<br><small>Teil entnommen</small>
          </button>
          <button class="type-btn" id="btn-zugang" onclick="setTyp('zugang')">
            <span class="type-icon">📥</span>Zugang<br><small>Lieferung</small>
          </button>
        </div>
        <div class="card-title">Menge</div>
        <div class="menge-row">
          <button class="m-btn m-minus" onclick="chM(-1)">−</button>
          <div class="m-num" id="m-num">1</div>
          <button class="m-btn m-plus" onclick="chM(1)">+</button>
        </div>
        <div class="preview-neu" id="preview-neu"></div>
        <button class="btn btn-green" id="btn-buchen" onclick="buchen()">✅ Abgang buchen</button>
        <button class="btn btn-light" onclick="resetScan()">↩ Abbrechen</button>
      </div>
    </div>

    <div id="tab-hist" class="hidden">
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:14px;font-size:12px;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;">
          Buchungen
          <button style="background:var(--gl);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--g1);cursor:pointer;" onclick="reloadData()">🔄 Neu laden</button>
        </div>
        <div id="hist-list"><div style="text-align:center;padding:30px;color:#ccc;font-size:14px;">Noch keine Buchungen</div></div>
      </div>
    </div>

    <div id="tab-info" class="hidden">
      <div class="card">
        <div class="card-title">Verbindung</div>
        <div style="font-size:14px;font-weight:600;color:var(--g1);" id="info-email">–</div>
        <div style="font-size:12px;color:#888;margin-top:4px;" id="info-file">–</div>
        <div style="font-size:12px;color:#888;margin-top:2px;" id="info-count">–</div>
      </div>
      <div class="card">
        <div class="card-title">Geladene ET-Nummern</div>
        <div id="info-keys" style="font-size:11px;color:#666;font-family:monospace;line-height:1.8;">–</div>
      </div>
      <button class="btn btn-green" onclick="reloadData()" style="margin-bottom:8px;">🔄 ET-Daten neu laden</button>
      <button class="btn btn-red" onclick="logout()">🚪 Abmelden</button>
    </div>
  </div>
</div>

<div class="loading hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Laden…</div>
</div>
<div class="toast" id="toast">OK</div>

<script>
const CLIENT_ID='e3b6b827-701a-47d4-bcab-c0bc9d8569b0';
const TENANT_ID='5ff1010c-565a-45ad-932a-b32c6606b8f7';
const REDIRECT='https://wyssflavio-pixel.github.io/et-scanner/';
const ET_SHEET='ET-Liste';
const FIRST_ROW=7;
const MAIL_TO='flavio.wyss@tschopp.swiss';
const MAIL_CC='christopher.nagel@tschopp.swiss';

const msalConfig={
  auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/'+TENANT_ID,redirectUri:REDIRECT},
  cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true}
};
const msalInst=new msal.PublicClientApplication(msalConfig);
const SCOPES=['Files.ReadWrite','User.Read','Mail.Send'];

let token='',fileId='',userEmail='',userName='';
let currentET=null,menge=1,buchTyp='abgang';
let etData={},bookings=[];
let codeReader=null;
let lastScan='',lastScanTime=0;

window.onload=async()=>{
  try{
    await msalInst.initialize();
    const resp=await msalInst.handleRedirectPromise();
    if(resp){
      token=resp.accessToken;userEmail=resp.account.username;
      userName=resp.account.name||userEmail.split('@')[0];
      await afterLogin();
    }else{
      const accs=msalInst.getAllAccounts();
      if(accs.length>0){
        try{
          const sr=await msalInst.acquireTokenSilent({scopes:SCOPES,account:accs[0]});
          token=sr.accessToken;userEmail=accs[0].username;
          userName=accs[0].name||userEmail.split('@')[0];
          await afterLogin();
        }catch(e){showLogin();}
      }else showLogin();
    }
  }catch(e){console.error(e);showLogin();}
};

function showLogin(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('main-screen').style.display='none';
}
async function login(){try{await msalInst.loginRedirect({scopes:SCOPES});}catch(e){toast('Fehler','err');}}
async function forceLogout(){
  try{
    // Clear all MSAL cache
    localStorage.clear();
    sessionStorage.clear();
    // Force logout via Microsoft
    await msalInst.logoutRedirect({postLogoutRedirectUri: window.location.href});
  }catch(e){
    localStorage.clear();
    sessionStorage.clear();
    window.location.reload();
  }
}
async function logout(){if(codeReader)codeReader.reset();await msalInst.logoutRedirect();}

async function afterLogin(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  document.getElementById('user-badge').style.display='flex';
  document.getElementById('user-name').textContent=userName;
  document.getElementById('info-email').textContent=userEmail;
  showLoading('ET-Daten werden geladen…');
  await loadETData();
  hideLoading();
  startScanner();
}

async function refreshToken(){
  const accs=msalInst.getAllAccounts();
  if(accs.length>0){
    try{const sr=await msalInst.acquireTokenSilent({scopes:SCOPES,account:accs[0]});token=sr.accessToken;}
    catch(e){}
  }
}

async function gGet(url){
  await refreshToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error('GET '+r.status);
  return r.json();
}
async function gPatch(url,body){
  await refreshToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{
    method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error('PATCH '+r.status);
  return r.json();
}
async function gPost(url,body){
  await refreshToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  return r.status;
}

async function loadETData(){
  try{
    document.getElementById('info-file').textContent='🔍 Suche…';
    const search=await gGet('/me/drive/root/search(q=\'ET-Liste_Tschopp\')');
    if(!search.value||!search.value.length){toast('Datei nicht gefunden!','err');return;}
    search.value.sort((a,b)=>new Date(b.lastModifiedDateTime)-new Date(a.lastModifiedDateTime));
    fileId=search.value[0].id;
    document.getElementById('info-file').textContent='📁 '+search.value[0].name;

    const range=await gGet(`/me/drive/items/${fileId}/workbook/worksheets/${ET_SHEET}/range(address='A${FIRST_ROW}:P500')`);
    etData={};
    let count=0;
    if(range.values){
      for(let i=0;i<range.values.length;i++){
        const row=range.values[i];
        const nr=row[0];
        if(!nr||!String(nr).toUpperCase().startsWith('ET'))continue;
        // Store with MULTIPLE keys for robust lookup
        const nrStr=String(nr).trim();
        const keyNoDash=nrStr.replace(/-/g,'').toUpperCase();
        const keyWithDash=nrStr.toUpperCase();
        const obj={
          nr:nrStr,anlage:String(row[1]||''),bez:String(row[2]||''),
          lagerort:String(row[3]||''),lagerplatz:String(row[4]||''),
          ist:parseFloat(row[5])||0,min:parseFloat(row[6])||0,max:parseFloat(row[7])||0,
          einheit:String(row[9]||'Stk'),ekp:parseFloat(row[10])||0,
          hersteller:String(row[12]||''),lieferant:String(row[13]||''),
          artNr:String(row[14]||''),lz:String(row[15]||''),
          row:i+FIRST_ROW
        };
        etData[keyNoDash]=obj;  // ET10001
        etData[keyWithDash]=obj; // ET-10001
        count++;
      }
    }
    document.getElementById('info-count').textContent='✅ '+count+' ET-Teile geladen';
    // Show all keys for debugging
    document.getElementById('info-keys').textContent=Object.keys(etData).join('\n');
    toast('✅ '+count+' ET-Teile geladen','ok');
  }catch(e){
    console.error(e);
    document.getElementById('info-file').textContent='❌ '+e.message;
    toast('Fehler: '+e.message,'err');
  }
}

async function reloadData(){showLoading('Aktualisiere…');await loadETData();hideLoading();}

function startScanner(){
  try{
    if(codeReader)codeReader.reset();
    codeReader=new ZXing.BrowserMultiFormatReader();
    codeReader.decodeFromVideoDevice(null,'qr-video',(result,err)=>{
      if(result){
        const text=result.getText();
        const now=Date.now();
        if(text===lastScan&&now-lastScanTime<3000)return;
        lastScan=text;lastScanTime=now;
        handleScan(text);
      }
    });
    document.getElementById('scan-status').textContent='QR-Code auf Kiste halten…';
  }catch(e){
    document.getElementById('scan-status').textContent='⚠️ Kamera nicht verfügbar';
  }
}

function handleScan(qrData){
  if(!qrData)return;

  document.getElementById('debug-box').textContent='Gesucht: "'+qrData+'" ('+qrData.length+' Zeichen)';

  const raw=qrData.trim();
  const rawUpper=raw.toUpperCase();
  const rawNoDash=rawUpper.replace(/-/g,'');

  // 1. ET-Nummer direkt versuchen
  let et=etData[rawUpper]||etData[rawNoDash];

  // 2. Nur Zahlen aus ET-Nr extrahieren
  if(!et){
    const nums=raw.replace(/[^0-9]/g,'');
    if(nums.length>=4){
      et=etData['ET'+nums]||etData['ET-'+nums.slice(0,2)+'-'+nums.slice(2)];
      if(!et){
        for(const k of Object.keys(etData)){
          if(k.replace(/[^0-9]/g,'')===nums){et=etData[k];break;}
        }
      }
    }
  }

  // 3. ARTIKELNUMMER suchen
  if(!et){
    for(const k of Object.keys(etData)){
      const e=etData[k];
      const artNr=String(e.artNr||'').toUpperCase().trim();
      if(!artNr)continue;
      if(artNr===rawUpper){et=e;break;}
    }
    if(!et){
      for(const k of Object.keys(etData)){
        const e=etData[k];
        const artNr=String(e.artNr||'').toUpperCase().trim();
        if(!artNr)continue;
        if(artNr.includes(rawUpper)||rawUpper.includes(artNr)){et=e;break;}
      }
    }
  }

  // 4. BEZEICHNUNG durchsuchen
  if(!et && raw.length>=3){
    for(const k of Object.keys(etData)){
      const e=etData[k];
      const bez=String(e.bez||'').toUpperCase();
      if(bez.includes(rawUpper)){et=e;break;}
    }
  }

  if(!et){
    document.getElementById('scan-status').textContent='❌ Nicht gefunden: "'+qrData+'"';
    toast('❌ Nicht gefunden','err');
    navigator.vibrate&&navigator.vibrate([100,50,100]);
    return;
  }

  navigator.vibrate&&navigator.vibrate(200);
  if(codeReader)codeReader.reset();
  currentET=et;menge=1;buchTyp='abgang';
  showET(et);updatePreview();
}

function manualSearch(){
  const val=document.getElementById('manual-et').value.trim();
  if(!val)return;
  handleScan(val);
  document.getElementById('manual-et').value='';
}

function showET(et){
  document.getElementById('et-nr').textContent=et.nr;
  document.getElementById('et-bez').textContent=et.bez;
  document.getElementById('et-anlage').textContent=et.anlage||'–';
  document.getElementById('et-details').innerHTML=
    (et.hersteller?'🏭 <b>Hersteller:</b> '+et.hersteller+'<br>':'')+
    (et.lieferant?'🚚 <b>Lieferant:</b> '+et.lieferant+'<br>':'')+
    (et.artNr?'🔢 <b>Artikelnummer:</b> '+et.artNr+'<br>':'')+
    '📦 <b>Lager:</b> '+(et.lagerort||'–')+' / '+(et.lagerplatz||'–');
  document.getElementById('s-ist').textContent=et.ist;
  document.getElementById('s-min').textContent=et.min;
  document.getElementById('s-max').textContent=et.max;
  let status='OK',bClass='badge-ok';
  if(et.ist===0){status='Kritisch';bClass='badge-krit';}
  else if(et.ist<=et.min){status='Bestellen';bClass='badge-best';}
  document.getElementById('et-badge').textContent=status;
  document.getElementById('et-badge').className='badge '+bClass;
  document.getElementById('s-ist').className='stat-val '+(status==='OK'?'ok':status==='Bestellen'?'warn':'crit');
  document.getElementById('et-card').classList.remove('hidden');
  document.getElementById('menge-card').classList.remove('hidden');
  document.getElementById('m-num').textContent='1';
}

function setTyp(typ){
  buchTyp=typ;
  document.getElementById('btn-abgang').className='type-btn'+(typ==='abgang'?' active-abgang':'');
  document.getElementById('btn-zugang').className='type-btn'+(typ==='zugang'?' active-zugang':'');
  document.getElementById('btn-buchen').textContent=typ==='abgang'?'✅ Abgang buchen':'✅ Zugang buchen';
  document.getElementById('btn-buchen').className='btn '+(typ==='abgang'?'btn-green':'btn-blue');
  updatePreview();
}

function chM(d){menge=Math.max(1,menge+d);document.getElementById('m-num').textContent=menge;updatePreview();}

function updatePreview(){
  if(!currentET)return;
  const neu=buchTyp==='abgang'?currentET.ist-menge:currentET.ist+menge;
  const sign=buchTyp==='abgang'?'−':'+';
  document.getElementById('preview-neu').innerHTML=`Bestand: ${currentET.ist} ${sign}${menge} = <strong>${Math.max(0,neu)}</strong>`;
}

async function findETRow(etNr){
  try{
    const range=await gGet(`/me/drive/items/${fileId}/workbook/worksheets/${ET_SHEET}/range(address='A${FIRST_ROW}:A500')`);
    if(range.values){
      for(let i=0;i<range.values.length;i++){
        const val=String(range.values[i][0]||'').trim().toUpperCase();
        if(val===etNr.trim().toUpperCase()){
          const foundRow = i+FIRST_ROW;
          document.getElementById('debug-box').textContent = 
            'Schreibe ' + etNr + ' in Zeile ' + foundRow + ' → Bestand: ' + (buchTyp==='abgang'?currentET.ist-menge:currentET.ist+menge);
          return foundRow;
        }
      }
    }
    document.getElementById('debug-box').textContent = 'ET ' + etNr + ' nicht in Excel gefunden! Nutze Cache-Zeile: ' + currentET.row;
  }catch(e){
    document.getElementById('debug-box').textContent = 'findETRow Fehler: ' + e.message;
    console.error('findETRow:',e);
  }
  return currentET.row;
}

async function buchen(){
  if(!currentET||!fileId)return;
  const neu=buchTyp==='abgang'?currentET.ist-menge:currentET.ist+menge;
  if(neu<0){toast('⚠️ Bestand wird negativ!','err');return;}
  showLoading('Wird in Excel gespeichert…');
  try{
    // Find the correct row live in Excel
    const liveRow = await findETRow(currentET.nr);
    await gPatch(`/me/drive/items/${fileId}/workbook/worksheets/${ET_SHEET}/range(address='F${liveRow}')`,{values:[[neu]]});
    const altIst=currentET.ist;
    const k=currentET.nr.replace(/-/g,'').toUpperCase();
    if(etData[k])etData[k].ist=neu;
    currentET.ist=neu;
    bookings.unshift({nr:currentET.nr,bez:currentET.bez,typ:buchTyp,menge,neu,altIst,
      time:new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}),user:userName});
    if(buchTyp==='abgang'&&neu<=currentET.min){
      showLoading('Mail wird gesendet…');
      await sendeMail(currentET,neu);
    }
    hideLoading();
    toast(`✅ ${currentET.nr} ${buchTyp==='abgang'?'−':'+'}${menge} → Bestand: ${neu}`,'ok');
    resetScan();
  }catch(e){
    hideLoading();
    console.error('buchen error:', e);
    toast('⚠️ Fehler: '+e.message+' (Zeile '+liveRow+')','err');
    // Show detailed error
    document.getElementById('debug-box').textContent = 
      'FEHLER: ' + e.message + ' | ET: ' + currentET.nr + ' | Zeile: ' + liveRow + ' | Bestand: ' + neu;
  }
}

async function sendeMail(et,neuerIst){
  const bm=et.max-neuerIst;
  const datum=new Date().toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const html=`<div style="font-family:Arial,sans-serif;max-width:600px;"><div style="background:#1A5C1A;color:#fff;padding:20px;border-radius:8px 8px 0 0;"><h2 style="margin:0;">⚠️ Meldebestand erreicht</h2><p style="margin:4px 0 0;opacity:.8;font-size:13px;">Tschopp Holzindustrie AG</p></div><div style="background:#fff;border:1px solid #ddd;border-top:none;padding:20px;border-radius:0 0 8px 8px;"><table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;"><tr style="background:#f5f5f5;"><td style="padding:8px 12px;font-weight:bold;width:45%;">ET-Nummer</td><td style="padding:8px 12px;">${et.nr}</td></tr><tr><td style="padding:8px 12px;font-weight:bold;">Bezeichnung</td><td style="padding:8px 12px;">${et.bez}</td></tr><tr style="background:#f5f5f5;"><td style="padding:8px 12px;font-weight:bold;">Anlage</td><td style="padding:8px 12px;">${et.anlage||'–'}</td></tr><tr><td style="padding:8px 12px;font-weight:bold;">Lagerort</td><td style="padding:8px 12px;">${et.lagerort||'–'} / ${et.lagerplatz||'–'}</td></tr><tr style="background:#f5f5f5;"><td style="padding:8px 12px;font-weight:bold;">Hersteller</td><td style="padding:8px 12px;">${et.hersteller||'–'}</td></tr></table><div style="background:#FFF3CD;border:1px solid #FFCA28;border-radius:8px;padding:16px;margin-bottom:16px;"><table style="width:100%;font-size:14px;border-collapse:collapse;"><tr><td style="padding:4px 0;font-weight:bold;">Bestand Ist</td><td style="color:#E53935;font-weight:bold;font-size:20px;">${neuerIst} ${et.einheit}</td></tr><tr><td style="padding:4px 0;font-weight:bold;">Mindestbestand</td><td>${et.min} ${et.einheit}</td></tr><tr><td style="padding:4px 0;font-weight:bold;">Maximalbestand</td><td>${et.max} ${et.einheit}</td></tr></table></div><div style="background:#1A5C1A;color:#fff;border-radius:8px;padding:16px;margin-bottom:16px;text-align:center;"><div style="font-size:12px;opacity:.8;margin-bottom:4px;">BESTELLMENGE</div><div style="font-size:36px;font-weight:bold;">${bm} ${et.einheit}</div></div><table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;"><tr style="background:#f5f5f5;"><td style="padding:8px 12px;font-weight:bold;width:45%;">Lieferant</td><td style="padding:8px 12px;">${et.lieferant||'–'}</td></tr><tr><td style="padding:8px 12px;font-weight:bold;">Artikelnummer</td><td style="padding:8px 12px;">${et.artNr||'–'}</td></tr><tr style="background:#f5f5f5;"><td style="padding:8px 12px;font-weight:bold;">Lieferzeit</td><td style="padding:8px 12px;">${et.lz||'–'} Tage</td></tr><tr><td style="padding:8px 12px;font-weight:bold;">Einkaufspreis</td><td style="padding:8px 12px;">CHF ${et.ekp?et.ekp.toFixed(2):'–'}</td></tr></table><div style="border-top:1px solid #eee;padding-top:12px;font-size:12px;color:#888;">📱 ET-Scanner App &nbsp;|&nbsp; 👤 ${userName} &nbsp;|&nbsp; 📅 ${datum}</div></div></div>`;
  const payload={message:{subject:'⚠️ MELDEBESTAND: '+et.nr+' – '+et.bez,body:{contentType:'HTML',content:html},toRecipients:[{emailAddress:{address:MAIL_TO}}],ccRecipients:[{emailAddress:{address:MAIL_CC}}]},saveToSentItems:true};
  try{const s=await gPost('/me/sendMail',payload);if(s===202)toast('📧 Mail gesendet!','info');}catch(e){console.error(e);}
}

function resetScan(){
  currentET=null;menge=1;buchTyp='abgang';
  document.getElementById('et-card').classList.add('hidden');
  document.getElementById('menge-card').classList.add('hidden');
  document.getElementById('debug-box').textContent='Warte auf Scan…';
  setTyp('abgang');
  startScanner();
}

function goTab(t){
  ['scan','hist','info'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['scan','hist','info'][i]===t));
  if(t==='hist')renderHist();
}

function renderHist(){
  const el=document.getElementById('hist-list');
  if(!bookings.length){el.innerHTML='<div style="text-align:center;padding:30px;color:#ccc;font-size:14px;">Noch keine Buchungen</div>';return;}
  el.innerHTML=bookings.map(b=>`<div class="hist-item"><div><div class="hist-nr">${b.nr} <span style="font-size:11px;color:#aaa">${b.typ==='abgang'?'Abgang':'Zugang'}</span></div><div class="hist-bez">${b.bez}</div><div class="hist-time">🕐 ${b.time} · ${b.altIst}→${b.neu} · ${b.user}</div></div><div class="hist-amt ${b.typ}">${b.typ==='abgang'?'−':'+'}${b.menge}</div></div>`).join('');
}

function showLoading(txt){document.getElementById('loading-text').textContent=txt||'Laden…';document.getElementById('loading').classList.remove('hidden');}
function hideLoading(){document.getElementById('loading').classList.add('hidden');}
function toast(msg,type=''){
  const el=document.getElementById('toast');el.textContent=msg;
  el.className='toast '+(type==='ok'?'ok':type==='err'?'err':type==='info'?'info':'');
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3500);
}
</script>
